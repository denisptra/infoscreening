name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, intl, fileinfo
          coverage: none

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Setup Temporary Environment
        run: |
          cp .env.example .env
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"

      - name: 5. Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-progress

      - name: 6. Build Frontend Assets (Vite)
        run: |
          npm ci
          npm run build

      - name: 7. Bersihkan File Non-Produksi Sebelum Deploy
        run: |
          rm -f .env
          rm -rf node_modules
          rm -rf tests
          rm -rf .github
          rm -rf deploy/cpanel/*.zip
          rm -f *.sql
          rm -rf import_per_table

      - name: 8. Deploy ke cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            storage/app/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/logs/**
            public/storage/**
            database/*.sqlite
            database/*.sql
