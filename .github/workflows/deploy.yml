name: Publish cPanel Deploy Branch

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: cpanel-deploy-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Build & publish deploy branch
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, intl, fileinfo
          coverage: none

      - name: 3. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 4. Siapkan environment build
        run: |
          cp .env.example .env
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"

      - name: 5. Install Composer dependencies (production)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-progress

      - name: 6. Build frontend assets (Vite)
        run: |
          npm ci
          npm run build

      - name: 7. Bersihkan file non-produksi
        run: |
          rm -f .env
          rm -rf node_modules tests .github deploy
          rm -f *.sql
          rm -rf import_per_table
          rm -f database/database.sqlite
          rm -f .phpunit.result.cache
          rm -f bootstrap/cache/*.php
          rm -f storage/framework/views/*.php
          rm -rf storage/framework/cache/data
          rm -f storage/framework/sessions/*
          rm -f storage/logs/*.log
          rm -rf .git

      - name: 8. Publikasikan branch deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -m "build: ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deploy
